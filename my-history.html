<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction History - Predictive Healthcare</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .history-container { 
            background: white; 
            border-radius: 12px; 
            padding: 2rem; 
            border: 1px solid var(--border-color); 
            overflow-x: auto;
        }
        
        .history-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 1rem; 
        }
        
        /* Fixed: Explicit alignment for headers and rows */
        .history-table th { 
            text-align: left; 
            padding: 1rem 1.25rem; 
            border-bottom: 2px solid #e2e8f0; 
            color: var(--text-muted); 
            font-size: 0.85rem; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            vertical-align: middle;
        }
        
        .history-table td { 
            padding: 1.25rem; 
            border-bottom: 1px solid #f1f5f9; 
            font-size: 0.95rem; 
            vertical-align: middle;
            color: var(--text-dark);
        }

        /* Fixed: Align Risk Pill badges cleanly */
        .status-pill { 
            padding: 0.4rem 0.9rem; 
            border-radius: 20px; 
            font-weight: 600; 
            font-size: 0.8rem; 
            display: inline-flex; 
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* Badge Colors */
        .bg-safe { background: #dcfce7; color: #15803d; }
        .bg-danger { background: #fee2e2; color: #b91c1c; }

        /* Fixed: Button alignment & interaction state */
        .btn-details {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-details:hover {
            background: #f8fafc;
            border-color: #94a3b8;
            color: var(--primary);
        }
    </style>
</head>
<body class="dashboard-page">

    <div class="dashboard-wrapper">
        <!-- STANDARD CLINICAL SIDEBAR -->
        <aside class="sidebar">
            <a href="index.html" class="sidebar-brand-link" id="brandLink">
                <div class="sidebar-brand">
                    <div class="logo-circle"><i class="fa-solid fa-notes-medical"></i></div>
                    <div class="brand-info">
                        <h2>Predictive</h2>
                        <h3>Healthcare Analysis</h3>
                    </div>
                </div>
            </a>

            <!-- Navigation Menu -->
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-grid-2"></i> <span class="nav-text">Dashboard</span></a>
                <a href="heart-prediction.html" class="menu-item"><i class="fa-solid fa-user-doctor"></i> <span class="nav-text">Health Prediction</span></a>
                <a href="my-history.html" class="menu-item active"><i class="fa-solid fa-clock-rotate-left"></i> <span class="nav-text">My History</span></a>
                <a href="health-records.html" class="menu-item"><i class="fa-solid fa-folder-medical"></i> <span class="nav-text">Health Records</span></a>
                <a href="charts-trends.html" class="menu-item"><i class="fa-solid fa-chart-line"></i> <span class="nav-text">Charts & Trends</span></a>
                <a href="recommendations.html" class="menu-item"><i class="fa-solid fa-heart-circle-check"></i> <span class="nav-text">Recommendations</span></a>
                <a href="profile-settings.html" class="menu-item"><i class="fa-solid fa-gear"></i> <span class="nav-text">Patient Profile</span></a>
                
                <a href="index.html" class="menu-item logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i> <span class="nav-text">Logout</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <div class="user-greeting">
                    <h1>Prediction History</h1>
                    <p>Review all your previous health analysis sessions.</p>
                </div>
            </header>

            <div class="history-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Risk Status</th>
                            <th>Assessment Type</th>
                            <th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- PIPELINE HISTORY RENDER PLATFORM -->
    <script>
        async function loadHistory() {
            try {
                const userId = localStorage.getItem('userId') || "65c1a8e9f1d2c3456789abcd";
                
                const response = await fetch(`http://localhost:5001/api/history/${userId}`);
                const data = await response.json();
                
                const historyBody = document.getElementById('historyBody');
                if (!historyBody) return;
                
                historyBody.innerHTML = '';

                const aiAssessments = data.filter(item => item.is_manual !== true);

                if (aiAssessments.length === 0) {
                    historyBody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted); padding: 2rem;">No system diagnostic assessments available. Please run an AI evaluation loop.</td></tr>`;
                    return;
                }

                aiAssessments.forEach(item => {
                    const row = document.createElement('tr');
                    
                    const isHighRisk = item.risk === 'HIGH RISK';
                    const badgeClass = isHighRisk ? 'bg-danger' : 'bg-safe';
                    
                    row.innerHTML = `
                        <td><strong>${new Date(item.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}</strong></td>
                        <td><span class="status-pill ${badgeClass}">${item.risk}</span></td>
                        <td><span style="color: var(--text-muted); font-weight: 500;"><i class="fa-solid fa-robot" style="color: var(--primary); margin-right: 6px;"></i> Automated Assessment</span></td>
                        <td style="text-align: right;"><button class="btn-details"><i class="fa-regular fa-file-lines"></i> Details</button></td>
                    `;
                    historyBody.appendChild(row);
                });
            } catch (error) {
                console.error("Error loading clinical assessment history:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>
    <script src="script.js"></script>
</body>
</html>
